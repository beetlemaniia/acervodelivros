<!DOCTYPE html>
<html lang="pt-BR"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>BiblioIA</title>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#F3F6F5;--card:#fff;--ink:#12292B;--mut:#5B6F70;--pri:#0E5A5C;--pri2:#E8F2F1;--acc:#F2A33A;--ln:#DCE6E5;--ok:#1F7A4D;--bl:#1D5FA8;--yl:#9A6A00;--rd:#B3261E;--gr:#5E6B6B;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#0C1819;--card:#142526;--ink:#E6F0EF;--mut:#98ADAD;--pri:#5CC4C1;--pri2:#1B3536;--ln:#264041;--ok:#6FD29B;--bl:#7DB7F0;--yl:#F0C45E;--rd:#FF8F85;--gr:#A5B3B3}}
html,body{height:100%;margin:0}*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font:15px/1.45 Sora,system-ui,sans-serif}
#app{max-width:480px;margin:0 auto;min-height:100%;display:flex;flex-direction:column;position:relative}
header{padding:14px 16px;display:flex;align-items:center;gap:10px;font-weight:700;font-size:18px}
main{flex:1;padding:0 16px 88px}
h2{font-size:20px;margin:6px 0 12px}h3{font-size:15px;margin:14px 0 8px}
.card{background:var(--card);border:1px solid var(--ln);border-radius:14px;padding:14px;margin-bottom:10px}
.row{display:flex;gap:10px;align-items:center}.sp{justify-content:space-between}.g{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.num{font-size:26px;font-weight:700}.mut{color:var(--mut);font-size:13px}
button,.btn{font:inherit;font-weight:600;border:0;border-radius:12px;padding:12px 16px;min-height:44px;background:var(--pri);color:#fff;cursor:pointer}
button.s{background:var(--pri2);color:var(--pri)}button.d{background:var(--rd);color:#fff}button.w{width:100%}button.t{padding:6px 10px;min-height:32px;font-size:13px}
:is(button,input,select,textarea,a):focus-visible{outline:3px solid var(--acc);outline-offset:2px}
input,select,textarea{font:inherit;width:100%;padding:11px;border:1px solid var(--ln);border-radius:10px;background:var(--card);color:var(--ink);margin:4px 0 10px;min-height:44px}
label{font-size:13px;font-weight:600;color:var(--mut)}label.c{display:flex;gap:8px;align-items:center;color:var(--ink);font-weight:400}label.c input{width:20px;min-height:20px;margin:0}
nav{position:fixed;bottom:0;left:0;right:0;background:var(--card);border-top:1px solid var(--ln);display:flex;justify-content:center;padding-bottom:env(safe-area-inset-bottom,0px)}
nav div{display:flex;width:100%;max-width:480px}nav button{flex:1;background:none;color:var(--mut);border-radius:0;font-size:12px;padding:8px 2px;position:relative}nav button.on{color:var(--pri)}nav button.on:after{content:"";position:absolute;top:0;left:30%;right:30%;height:3px;background:var(--acc);border-radius:0 0 3px 3px}
.bd{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:600;padding:2px 9px;border-radius:99px;border:1px solid currentColor}.bd:before{content:"";width:7px;height:7px;border-radius:50%;background:currentColor}
.ok{color:var(--ok)}.bl{color:var(--bl)}.yl{color:var(--yl)}.rd{color:var(--rd)}.gr{color:var(--gr)}
.cov{width:46px;height:60px;border-radius:6px 10px 10px 6px;display:grid;place-items:center;color:#fff;font-size:20px;flex:none;border-left:5px solid rgba(0,0,0,.25)}
.ov{position:fixed;inset:0;background:rgba(0,0,0,.5);display:flex;align-items:flex-end;justify-content:center;z-index:20}
.md{background:var(--bg);width:100%;max-width:480px;max-height:88%;overflow:auto;border-radius:20px 20px 0 0;padding:16px;animation:up .2s}
@keyframes up{from{transform:translateY(40px);opacity:0}}
@media(prefers-reduced-motion:reduce){*{animation:none!important}}
table{width:100%;border-collapse:collapse;font-size:12px}td,th{border:1px solid var(--ln);padding:6px;text-align:left;vertical-align:top}
.cell{background:var(--card);cursor:pointer}.ex{color:var(--rd);font-weight:700}
.msg{padding:9px 12px;border-radius:14px;margin:6px 0;max-width:88%}.ai{background:var(--pri2)}.me{background:var(--pri);color:#fff;margin-left:auto}
.bar{height:12px;border-radius:6px;background:var(--pri);min-width:3px}
.full{min-height:100vh;display:grid;place-content:center;text-align:center;padding:24px;gap:14px}
.tabs{display:flex;gap:6px;overflow-x:auto;margin-bottom:10px}.tabs button{white-space:nowrap}
.toast{position:fixed;top:14px;left:50%;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:12px;z-index:30;max-width:90%}
</style></head><body><div id="app"></div>
<script>
const KEY='biblioia_v1',$=s=>document.getElementById(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const H=36e5,D=24*H,now=()=>Date.now(),fd=t=>t?new Date(t).toLocaleString('pt-BR',{dateStyle:'short',timeStyle:'short'}):'—';
const MAT=['Matemática','Português','História','Geografia','Biologia','Física','Química','Filosofia','Sociologia'];
const PROF={Matemática:'Rui Alves',Português:'Lia Costa',História:'Carla Mendes',Biologia:'Teo Nunes',Física:'Paulo Reis',Química:'Inês Prado',Geografia:'Marta Lopes',Filosofia:'Davi Sá',Sociologia:'Eva Rocha'};
const SLOT=[['07:30','08:20'],['08:20','09:10'],['09:30','10:20'],['10:20','11:10']];
const GRID=[['Matemática','Português','História','Biologia'],['Física','Química','Geografia','Matemática'],['Português','Filosofia','Sociologia','História'],['Biologia','Matemática','Física','Português'],['Química','Geografia','Filosofia','Sociologia']];
const DIAS=['Segunda','Terça','Quarta','Quinta','Sexta'],TURMAS={'2A':30,'2B':28};
const COL=['#0E5A5C','#8A4B08','#7A2E65','#2F5D9E','#3F7D2B','#A23B3B','#555FA8','#6B5B2F','#2B6F7A'];
const KB={'revolução industrial':['A Revolução Industrial começou na Inglaterra, por volta de 1760, com a mecanização da produção têxtil e o uso da máquina a vapor.','Trouxe urbanização acelerada, surgimento do operariado e novas questões sociais.'],'fotossíntese':['A fotossíntese converte luz, água e gás carbônico em glicose e oxigênio.','Ocorre nos cloroplastos e tem etapa clara (tilacoides) e etapa química (estroma).'],'equação do 2º grau':['Forma geral: ax²+bx+c=0, com a≠0.','Discriminante Δ=b²−4ac; as raízes são x=(−b±√Δ)/2a. Δ<0: sem raízes reais.']};
const uid=p=>p+Math.random().toString(36).slice(2,8);
function seed(){const b=[],cn=[4,3,2,3,3,2,3,2,2],tt=['Matemática em Contexto','Língua e Linguagem','História em Foco','Geografia Viva','Biologia Integrada','Física Essencial','Química Cotidiana','Filosofar Hoje','Sociologia Atual'];
MAT.forEach((m,i)=>b.push({id:'B'+(i+1),t:tt[i],m,a:'Autoria fictícia '+(i+1),s:'2º ano',ed:'Ed. Demo',isbn:'',col:COL[i],cp:Array.from({length:cn[i]},(_,k)=>({id:'B'+(i+1)+'-'+(k+1),st:'estante'}))}));
const c=(bi,k)=>b[bi].cp[k],L=[];
const ln=(al,cp,ini,due,ret,st,cond)=>L.push({id:uid('L'),al,cp:cp.id,b:cp.id.split('-')[0],ini,due,ret,st,cond});
const n=now();
const al=(cp,x)=>{cp.st='emprestado';return cp};
ln('2024001',al(c(0,0)),n-H,n+3*H,null,'ativo');
ln('2024002',al(c(2,0)),n-2*H,n+D,null,'ativo');ln('2024003',al(c(2,1)),n-H,n+2*D,null,'ativo');
ln('2024002',al(c(5,0)),n-3*D,n-D,null,'ativo');
ln('2024001',c(4,0),n-9*D,n-8*D,n-8*D,'devolvido','Bom');
b[3].cp[2].st='danificado';b[8].cp[1].st='nao_localizado';
const T=n;return{ver:1,users:{al:{'2024001':{nome:'Ana Souza',mat:'2024001',curso:'Ensino Médio',serie:'2º ano',turma:'2A',senha:'aluno123'},'2024002':{nome:'Bruno Lima',mat:'2024002',curso:'Ensino Médio',serie:'2º ano',turma:'2A',senha:'aluno123'},'2024003':{nome:'Caio Rocha',mat:'2024003',curso:'Ensino Médio',serie:'2º ano',turma:'2A',senha:'aluno123'}},pr:{PROF01:{nome:'Carla Mendes',id:'PROF01',materias:['História'],senha:'prof123'}},zl:{zelador:{senha:'zel123'}}},
books:b,loans:L,aulas:[],wait:[],notif:[{id:uid('N'),to:'al:2024001',t:'Bem-vinda ao BiblioIA',d:'Dados de demonstração carregados.',cat:'Comunicado',ts:T,lido:false},{id:uid('N'),to:'al:2024001',t:'Devolução próxima',d:'Devolva Matemática em Contexto até '+fd(n+3*H)+'.',cat:'Prazo',ts:T,lido:false}],
rep:[],audit:[],cfg:{aulaMin:50,casaDias:3,reservaH:24}}}
let S=JSON.parse(localStorage.getItem(KEY)||'null')||seed();
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}};
let me=null,tab='home',sub={},modal='',stage='splash',toastT=0;
const bk=id=>S.books.find(b=>b.id==id),avail=b=>b.cp.filter(c=>c.st=='estante').length;
const tot=b=>b.cp.filter(c=>!['danificado','manutencao','nao_localizado'].includes(c.st)).length;
const bt=id=>bk(id.split('-')[0]);
const stat=l=>l.st=='ativo'?(l.due<now()?['Atrasado','rd']:l.due-now()<3*H?['Vence logo','yl']:['Ativo','bl']):l.st=='conferir'?['Aguardando conferência','yl']:['Devolvido','ok'];
const badge=(t,c)=>`<span class="bd ${c}">${t}</span>`;
const avb=b=>avail(b)>0?badge(avail(b)+' disponível(is)','ok'):badge('Indisponível','bl');
const notify=(to,t,d,cat)=>S.notif.unshift({id:uid('N'),to,t,d,cat,ts:now(),lido:false});
const aud=a=>S.audit.unshift({ts:now(),by:me?me.role+':'+me.key:'sistema',a});
function toast(m){clearTimeout(toastT);let e=document.querySelector('.toast');if(e)e.remove();e=document.createElement('div');e.className='toast';e.setAttribute('role','status');e.textContent=m;document.body.append(e);toastT=setTimeout(()=>e.remove(),2800)}
const U=()=>me&&S.users[me.role][me.key];
const val=id=>($(id)||{}).value||'';
function freeCopy(b,list){const c=b.cp.find(c=>c.st=='estante');if(c)return c}
function released(b){const w=S.wait.find(x=>x.b==b.id);if(w){notify('al:'+w.al,'Livro disponível','"'+b.t+'" voltou ao estoque. Faça seu empréstimo.','Estoque');S.wait=S.wait.filter(x=>x!==w)}}
/* ---------- logo ---------- */
const logo=(s=36)=>`<svg width="${s}" height="${s}" viewBox="0 0 40 40" aria-hidden="true"><rect width="40" height="40" rx="10" fill="#0E5A5C"/><path d="M9 12h9c2 0 2 1 2 2v15c0-1-1-2-2-2H9zM31 12h-9c-2 0-2 1-2 2v15c0-1 1-2 2-2h9z" fill="none" stroke="#fff" stroke-width="2" stroke-linejoin="round"/><circle cx="20" cy="9" r="2.5" fill="#F2A33A"/><circle cx="30" cy="9" r="1.5" fill="#F2A33A"/><path d="M20 9h10" stroke="#F2A33A" stroke-width="1.2"/></svg>`;
/* ---------- render ---------- */
function render(){const a=$('app');
if(stage=='splash'){a.innerHTML=`<div class="full">${logo(88)}<h1 style="margin:0;font-size:34px">BiblioIA</h1><div class="mut">Livros da sala, sempre à mão</div></div>`;setTimeout(()=>{stage=localStorage.getItem('bia_intro')?'login':'intro';render()},1100);return}
if(stage=='intro'){a.innerHTML=`<div class="full">${logo(64)}<h2>Cada aluno com o livro certo, na hora da aula</h2><p class="mut">Empréstimos, devoluções, avisos dos professores e conferência da estante com apoio de IA.</p><button class="w" onclick="localStorage.setItem('bia_intro',1);stage='login';render()">Começar</button></div>`;return}
if(!me){a.innerHTML=authView();return}
const nav={al:[['home','Início'],['hor','Horários'],['acervo','Acervo'],['not','Avisos'],['perf','Perfil']],pr:[['home','Início'],['hor','Horários'],['aulas','Aulas'],['not','Avisos'],['perf','Perfil']],zl:[['home','Início'],['acervo','Acervo'],['emp','Empréstimos'],['rx','Raio-X'],['perf','Perfil']]}[me.role];
const un=S.notif.filter(n=>n.to==me.role+':'+me.key&&!n.lido).length;
a.innerHTML=`<header>${logo(30)}BiblioIA</header><main id="main">${page()}</main><nav><div>${nav.map(([k,l])=>`<button class="${tab==k?'on':''}" onclick="go('${k}')">${l}${k=='not'&&un?` (${un})`:''}</button>`).join('')}</div></nav>${modal?`<div class="ov" onclick="if(event.target==this)closeM()"><div class="md" role="dialog" aria-modal="true">${modal}</div></div>`:''}`}
const go=t=>{tab=t;sub={};render();scrollTo(0,0)},closeM=()=>{modal='';render()},openM=h=>{modal=h;render()};
function authView(){const m=sub.mode||'login',r=sub.role||'al';
const roles=`<div class="tabs">${[['al','Aluno'],['pr','Professor'],['zl','Zelador']].map(([k,l])=>`<button class="${r==k?'':'s'}" onclick="sub.role='${k}';render()">${l}</button>`).join('')}</div>`;
let f='';
if(m=='login')f=r=='al'?`<label>Matrícula</label><input id="k" inputmode="numeric">`:r=='pr'?`<label>Identificação de acesso</label><input id="k">`:`<label>Login</label><input id="k">`;
else f=r=='al'?`<label>Nome completo</label><input id="nm"><label>Matrícula</label><input id="k" inputmode="numeric"><label>Curso</label><input id="cu" value="Ensino Médio"><label>Série/ano</label><input id="se" value="2º ano"><label>Turma</label><select id="tu">${Object.keys(TURMAS).map(t=>`<option>${t}</option>`)}</select>`:`<label>Nome completo</label><input id="nm"><label>Matéria(s), separadas por vírgula</label><input id="mt" placeholder="História"><label>Identificação de acesso</label><input id="k"><label>Código da escola</label><input id="cod" placeholder="Informado pela escola">`;
return`<div style="padding:20px 16px">${`<div class="row" style="margin:10px 0 18px">${logo(44)}<h1 style="margin:0">BiblioIA</h1></div>`}<h2>${m=='login'?'Entrar':'Criar conta'}</h2>${roles}<div class="card">${f}<label>Senha</label><input id="pw" type="password">${m=='login'?`<button class="w" onclick="doLogin()">Entrar</button>`:`<button class="w" onclick="doReg()">Criar conta</button>`}${r!='zl'?`<p class="mut" style="text-align:center"><a href="#" onclick="sub.mode='${m=='login'?'reg':'login'}';render();return false">${m=='login'?'Não tenho conta':'Já tenho conta'}</a></p>`:''}</div>
<div class="card"><b>Contas de demonstração</b><div class="mut">Aluno: 2024001 / aluno123<br>Professor: PROF01 / prof123<br>Zelador: zelador / zel123<br><br>Dados fictícios guardados só neste navegador.</div><button class="s t" onclick="if(confirm('Restaurar dados de demonstração?')){S=seed();save();toast('Dados restaurados')}">Restaurar demonstração</button></div></div>`}
function doLogin(){const r=sub.role||'al',k=val('k').trim(),u=S.users[r][k];if(!u||u.senha!==val('pw'))return toast('Credenciais inválidas. Confira os dados ou use uma conta de demonstração.');me={role:r,key:k};tab='home';sub={};aud('login');save();render()}
function doReg(){const r=sub.role||'al',k=val('k').trim(),pw=val('pw');if(!val('nm').trim()||!k||pw.length<6)return toast('Preencha todos os campos. A senha precisa ter 6 caracteres ou mais.');if(S.users[r][k])return toast('Este identificador já está cadastrado.');
if(r=='al')S.users.al[k]={nome:val('nm').trim(),mat:k,curso:val('cu'),serie:val('se'),turma:val('tu'),senha:pw};
else{if(val('cod')!=='ESCOLA2026')return toast('Código da escola inválido (demonstração: ESCOLA2026).');S.users.pr[k]={nome:val('nm').trim(),id:k,materias:val('mt').split(',').map(s=>s.trim()).filter(Boolean),senha:pw}}
save();sub={mode:'login',role:r};toast('Conta criada. Faça login.');render()}
function page(){const k=me.role+':'+tab;return({'al:home':aHome,'al:hor':horView,'al:acervo':acervo,'al:not':notView,'al:perf':perfil,'pr:home':pHome,'pr:hor':horView,'pr:aulas':aulasView,'pr:not':notView,'pr:perf':perfil,'zl:home':zHome,'zl:acervo':zAcervo,'zl:emp':zEmp,'zl:rx':rxView,'zl:perf':zPerf}[k])()}
/* ---------- aluno ---------- */
const myLoans=()=>S.loans.filter(l=>l.al==me.key);
const aulasT=t=>S.aulas.filter(a=>a.turma==t&&a.status=='ativa'&&a.ts0>now()-D);
function aHome(){const u=U(),ac=myLoans().filter(l=>l.st!='devolvido'),nx=ac.sort((a,b)=>a.due-b.due)[0],au=aulasT(u.turma).sort((a,b)=>a.ts0-b.ts0)[0],nn=S.notif.filter(n=>n.to=='al:'+me.key).slice(0,2);
return`<h2>Olá, ${esc(u.nome.split(' ')[0])}!</h2><div class="g"><div class="card"><div class="num">${ac.length}</div><div class="mut">livros emprestados</div></div><div class="card"><div class="mut">Próxima devolução</div><b>${nx?fd(nx.due):'Nenhuma'}</b></div></div>
<div class="card"><div class="mut">Próxima aula com livro</div>${au?`<b>${esc(au.mat)}</b> — ${esc(bk(au.book).t)}<br><span class="mut">${esc(au.date)} ${esc(au.ini)}</span>`:'Nenhuma aula pede livro agora.'}</div>
<div class="row"><button class="w" onclick="go('acervo')">Pegar livro</button><button class="w s" onclick="tab='dev';sub={};render()">Devolver</button></div>
<h3>Meus empréstimos</h3>${ac.map(l=>`<div class="card row sp"><div><b>${esc(bt(l.cp).t)}</b><div class="mut">Devolver até ${fd(l.due)}</div></div>${badge(...stat(l))}</div>`).join('')||'<div class="card mut">Você não tem livros emprestados.</div>'}
<h3>Avisos recentes</h3>${nn.map(n=>`<div class="card"><b>${esc(n.t)}</b><div class="mut">${esc(n.d)}</div></div>`).join('')||'<div class="card mut">Sem avisos.</div>'}`}
function horView(){const pr=me.role=='pr',u=U(),turmas=pr?u.turmas||Object.keys(TURMAS):[u.turma];
return`<h2>Horários</h2>`+turmas.map(t=>`<h3>Turma ${t}</h3><div style="overflow-x:auto"><table><tr><th></th>${DIAS.map(d=>`<th>${d.slice(0,3)}</th>`).join('')}</tr>${SLOT.map((s,i)=>`<tr><td>${s[0]}<br>${s[1]}</td>${GRID.map((g,d)=>{const m=g[i];if(pr&&!u.materias.includes(m))return'<td></td>';const ex=S.aulas.some(a=>a.turma==t&&a.status=='ativa'&&a.dia==d&&a.mat==m);return`<td class="cell" onclick="slotM('${t}',${d},${i})">${m}${ex?' <span class="ex" title="Exige livro">(!)</span>':''}<div class="mut">${pr?'Sala '+t:PROF[m].split(' ')[0]}</div></td>`}).join('')}</tr>`).join('')}</table></div>`).join('')+`<p class="mut"><span class="ex">(!)</span> A aula exige livro. Toque na matéria para ver os detalhes.</p>`}
function slotM(t,d,i){const m=GRID[d][i],as=S.aulas.filter(a=>a.turma==t&&a.status=='ativa'&&a.dia==d&&a.mat==m);
openM(`<h3>${m} — ${DIAS[d]}</h3><p class="mut">${SLOT[i][0]}–${SLOT[i][1]} · Prof. ${PROF[m]}</p>${as.map(a=>`<div class="card"><b>${esc(bk(a.book).t)}</b><br>Data: ${esc(a.date)} · ${esc(a.ini)}<br>${a.qtd} exemplar(es) · ${['Individual','Em dupla','Em grupo','Personalizado'][a.mod]}<br>Páginas: ${esc(a.pag||'—')}<br>${esc(a.desc||'')}<br><span class="mut">${esc(a.obs||'')}</span></div>`).join('')||'<p>Esta aula não exige livro.</p>'}<button class="w s" onclick="closeM()">Fechar</button>`)}
function acervo(){const f=sub.f||{};let l=S.books.filter(b=>(!f.q||(b.t+b.a).toLowerCase().includes(f.q.toLowerCase()))&&(!f.m||b.m==f.m)&&(!f.d||(f.d=='1'?avail(b)>0:avail(b)==0)));
if(sub.id)return bookView(bk(sub.id));
if(tab=='dev')return devView();
return`<h2>Acervo</h2><input id="q" placeholder="Buscar título ou autor" value="${esc(f.q||'')}" oninput="sub.f={...sub.f,q:this.value};keep('q')"><div class="g"><select id="fm" onchange="sub.f={...sub.f,m:this.value};render()"><option value="">Todas as matérias</option>${MAT.map(m=>`<option ${f.m==m?'selected':''}>${m}</option>`)}</select><select onchange="sub.f={...sub.f,d:this.value};render()"><option value="">Qualquer disponibilidade</option><option value="1" ${f.d=='1'?'selected':''}>Disponíveis</option><option value="0" ${f.d=='0'?'selected':''}>Indisponíveis</option></select></div>

function rxView(){const last=S.rep[0];
if(sub.res)return rxRes();
return`<h2>Raio-X da estante</h2><div class="card"><p class="mut">Envie a foto da estante. <b>Modo simulado:</b> nenhuma visão computacional real é usada; o resultado vem do inventário com níveis de confiança fictícios. A integração com OCR/visão fica no ponto <code>analisarImagem()</code>.</p><input type="file" accept="image/*" capture="environment" id="rf"><button class="w" onclick="rxRun()">Analisar estante (simulação)</button></div>
<h3>Conferências salvas</h3>${S.rep.map(r=>`<div class="card"><b>${fd(r.ts)}</b><div class="mut">Esperados ${r.exp} · Reconhecidos ${r.rec} · Divergências ${r.div}</div></div>`).join('')||'<div class="card mut">Nenhum relatório salvo.</div>'}${S.rep.length>1?`<div class="card">Comparação com a anterior: ${S.rep[0].rec-S.rep[1].rec>=0?'+':''}${S.rep[0].rec-S.rep[1].rec} reconhecidos, ${S.rep[0].div-S.rep[1].div>=0?'+':''}${S.rep[0].div-S.rep[1].div} divergências.</div>`:''}`}
function analisarImagem(){/* TODO: integrar API real de visão/OCR. Retorna [{id,conf}] */return allC().filter(c=>c.st=='estante').map((c,i)=>({id:c.id,conf:(i%6==4)?.55:(i%6==2?.82:.95)}))}
function rxRun(){if(!$('rf').files.length)return toast('Selecione ou tire uma foto da estante.');sub.res={items:analisarImagem().map(x=>({...x,ok:x.conf>=.8})),extra:['Atlas escolar (fora do inventário)']};render()}
function rxRes(){const r=sub.res,rec=r.items.filter(i=>i.ok),exp=allC().filter(c=>c.st=='estante'),miss=r.items.filter(i=>!i.ok),just=allC().filter(c=>['emprestado','reservado','conferencia'].includes(c.st)),byM={};rec.forEach(i=>{const m=bt(i.id).m;byM[m]=(byM[m]||0)+1});
return`<h2>Relatório</h2><div class="g"><div class="card"><div class="num">${r.items.length+r.extra.length}</div><div class="mut">livros vistos</div></div><div class="card"><div class="num">${exp.length}</div><div class="mut">esperados na estante</div></div></div>
<div class="card"><b>Resumo (regras locais, sem IA real)</b><br>${rec.length} reconhecidos com segurança. ${miss.length} precisam de confirmação manual. ${just.length} exemplares fora da estante estão justificados (emprestados, reservados ou em conferência) e não são tratados como desaparecidos.</div>
<h3>Revisar</h3>${r.items.map((i,k)=>`<div class="card row sp"><div><b>${esc(bt(i.id).t)}</b><div class="mut">${i.id} · confiança ${Math.round(i.conf*100)}%</div></div>${i.ok?badge('Confirmado','ok'):`<button class="t s" onclick="sub.res.items[${k}].ok=true;render()">Confirmar presença</button>`}</div>`).join('')}${r.extra.map(e=>`<div class="card yl">Não consta no inventário: ${e}</div>`).join('')}
<div class="card mut">Por matéria: ${Object.entries(byM).map(([m,n])=>m+' '+n).join(' · ')}</div>
<div class="row"><button class="w" onclick="rxSave()">Salvar relatório</button><button class="w s" onclick="sub={};render()">Descartar</button></div>`}
function rxSave(){const r=sub.res;S.rep.unshift({ts:now(),exp:allC().filter(c=>c.st=='estante').length,rec:r.items.filter(i=>i.ok).length,div:r.items.filter(i=>!i.ok).length+r.extra.length});aud('Raio-X salvo');save();sub={};toast('Relatório salvo.');render()}
function zPerf(){const cnts={};S.loans.forEach(l=>{const t=bt(l.cp).t;cnts[t]=(cnts[t]||0)+1});const top=Object.entries(cnts).sort((a,b)=>b[1]-a[1]).slice(0,5),mx=top[0]?top[0][1]:1;
return`<h2>Perfil e relatórios</h2><div class="card"><b>Livros mais emprestados</b>${top.map(([t,n])=>`<div class="row" style="margin:6px 0"><span class="mut" style="width:120px">${esc(t)}</span><div class="bar" style="width:${n/mx*40}%"></div>${n}</div>`).join('')}</div><div class="card"><b>Configurações</b><label>Duração da aula (min)</label><input id="c1" type="number" value="${S.cfg.aulaMin}"><label>Prazo para casa (dias)</label><input id="c2" type="number" value="${S.cfg.casaDias}"><label>Validade de reserva (h)</label><input id="c3" type="number" value="${S.cfg.reservaH}"><button class="s w" onclick="S.cfg={aulaMin:+val('c1')||50,casaDias:+val('c2')||3,reservaH:+val('c3')||24};aud('Configurações alteradas');save();toast('Configurações salvas.')">Salvar</button></div><h3>Auditoria</h3>${S.audit.slice(0,8).map(a=>`<div class="card mut">${fd(a.ts)} · ${esc(a.by)}<br>${esc(a.a)}</div>`).join('')||'<div class="card mut">Sem registros.</div>'}<button class="d w" onclick="me=null;sub={};render()">Sair</button>`}
render();
</script></body></html>
